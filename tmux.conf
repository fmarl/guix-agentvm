set -g prefix C-]
unbind C-b
bind C-] send-prefix

set -g default-terminal tmux-256color
set -s escape-time 10
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
setw -g clock-mode-style 24

set -as terminal-features ",xterm*:RGB:extkeys,alacritty*:RGB"

set -g set-clipboard on

set -s extended-keys on
set -s extended-keys-format csi-u

set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#1d2235,fg=#989898"
set -g status-left-length 32
set -g status-right-length 60
set -g status-left "#{?client_prefix,#[bg=#feacd0],#[bg=#2fafff]}#[fg=#0d0e1c,bold] #S #[default] "
set -g status-right "#{?pane_in_mode,#[fg=#d0bc00#,bold]COPY  ,}#[fg=#989898]#{b:pane_current_path}  #[fg=#ffffff]%H:%M "
set -g window-status-separator ""
set -g window-status-format " #I #W#{?window_zoomed_flag, (z),} "
set -g window-status-current-format "#[bg=#4a4f69,fg=#ffffff,bold] #I #W#{?window_zoomed_flag, (z),} "
set -g window-status-bell-style "fg=#ff5f59,bold"
set -g window-status-activity-style "fg=#2fafff"

set -g pane-border-lines single
set -g pane-border-style "fg=#4a4f69"
set -g pane-active-border-style "fg=#2fafff"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#2fafff#,bold],#[fg=#989898]} #{pane_current_command} "

set -g message-style "bg=#1d2235,fg=#ffffff"
set -g message-command-style "bg=#1d2235,fg=#feacd0"
set -g mode-style "bg=#555a66,fg=#ffffff"

set -g renumber-windows on
set -g detach-on-destroy off
set -g set-titles on
set -g set-titles-string "#S: #W"

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
